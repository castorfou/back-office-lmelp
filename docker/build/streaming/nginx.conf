# lmelp-streaming : sert l'audio des émissions à lmelp-mobile, sur internet,
# derrière la clé d'écoute (ADR 0003). Seule entrée du reverse proxy DSM au
# profil « internet ».
#
# Vers le backend, deux chemins seulement : la vérification de la clé
# (sous-requête interne) et POST /signalements. Tout le reste répond 404 sans
# toucher au backend.
#
# Ce fichier est inclus dans le bloc http de nginx (conf.d) : les directives
# ci-dessous, avant « server », sont de niveau http.

# Réponses « clé valide » du backend gardées 60 s par clé ; un refus n'est
# jamais mis en cache (seul 204 l'est).
proxy_cache_path /var/cache/nginx/cle levels=1 keys_zone=cle_ecoute:1m max_size=10m inactive=10m use_temp_path=off;

# Débit limité par IP réelle de l'auditeur : DSM pose X-Real-IP. Le port n'est
# publié que sur 127.0.0.1 (docker-compose) : seul le reverse proxy DSM
# atteint le conteneur, par la passerelle du réseau Docker.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Real-IP;
limit_req_zone $binary_remote_addr zone=audio_par_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=signalements_par_ip:1m rate=6r/m;
limit_req_status 429;

# La clé arrive en en-tête X-Lmelp-Cle, ou à défaut en paramètre ?cle=.
# Lue dans $request_uri et non $arg_cle : la sous-requête de vérification a sa
# propre URI, sans paramètres, mais garde $request_uri de la requête d'origine.
map $request_uri $cle_parametre {
    "~[?&]cle=(?<cle>[^&]+)" $cle;
    default                  "";
}
map $http_x_lmelp_cle $cle_recue {
    ""      $cle_parametre;
    default $http_x_lmelp_cle;
}

# Journal sans la chaîne de requête : la clé passée en ?cle= n'y figure pas.
log_format sans_cle '$remote_addr [$time_local] "$request_method $uri" '
                    '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log sans_cle;
    # Les erreurs nginx (débit dépassé, backend injoignable…) recopient la ligne
    # de requête, clé en ?cle= comprise : seules les erreurs critiques sont
    # journalisées.
    error_log /var/log/nginx/error.log crit;

    # Re-résout « backend » à chaque requête (cache 10 s) via le DNS interne
    # de Docker : une recréation du conteneur backend change son IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend backend:8000;

    # Dossier audio de lmelp, monté en lecture seule sur /srv/audios.
    root /srv;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Vérification de la clé : sous-requête de auth_request, jamais appelable
    # de l'extérieur. Backend injoignable ou réponse autre que 204 : refus.
    location = /_verifier_cle {
        internal;
        proxy_pass http://$backend/api/cle-ecoute/verifier;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Lmelp-Cle $cle_recue;
        proxy_cache cle_ecoute;
        proxy_cache_key $cle_recue;
        proxy_cache_valid 204 60s;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # L'audio de l'épisode, tel quel : <base>/audios/<audio_rel_filename>.
    # Range natif (206) ; aucune copie gardée par le client.
    location /audios/ {
        auth_request /_verifier_cle;
        limit_req zone=audio_par_ip burst=40 nodelay;
        add_header Cache-Control "no-store" always;
        error_page 500 = @backend_indisponible;
        try_files $uri =404;

        # un téléchargement en cours (<fichier>.part) n'est pas servi
        location ~ \.part$ {
            return 404;
        }
    }

    # La vérification de la clé n'a pas abouti (backend injoignable) : 503,
    # « réessayer plus tard », à ne pas confondre avec 403 « clé refusée ».
    location @backend_indisponible {
        add_header Cache-Control "no-store" always;
        return 503;
    }

    # Signalement d'un Passage depuis lmelp-mobile, relayé au backend. La
    # source est posée ici, quoi qu'envoie le client ; ni la clé ni l'IP de
    # l'auditeur ne sont transmises.
    location = /signalements {
        # 405 et non 403 : pour lmelp-mobile, 403 veut dire « clé refusée »
        if ($request_method != POST) {
            return 405;
        }
        auth_request /_verifier_cle;
        limit_req zone=signalements_par_ip burst=5 nodelay;
        error_page 500 = @backend_indisponible;
        client_max_body_size 4k;
        proxy_pass http://$backend/api/signalements;
        proxy_set_header X-Lmelp-Source mobile;
        proxy_set_header X-Lmelp-Cle "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
